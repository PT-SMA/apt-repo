services:
  apt-repo:
    build: .
    image: apt-repo:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      ADMIN_USER: admin
      # Leave empty to have one generated (printed once in the logs, kept in the volume).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REPO_DISTRIBUTIONS: trixie bookworm
      REPO_COMPONENT: main
      REPO_ARCHITECTURES: amd64,arm64
      REPO_ORIGIN: My Company
      REPO_LABEL: my-company
      GPG_NAME: My Company APT Signing Key
      GPG_EMAIL: apt@example.com
      # Require a login to read the repository (clients use /etc/apt/auth.conf.d/):
      # REPO_READ_USER: apt
      # REPO_READ_PASSWORD: change-me
    volumes:
      - apt-data:/data
    # Sign with your own passphrase-less key instead of generating one:
    # secrets:
    #   - repo-signing-key

volumes:
  apt-data:

# secrets:
#   repo-signing-key:
#     file: ./signing-key.asc
