<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APT Repository</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%23a80030'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="logged-out">
  <header class="topbar">
    <a class="brand" href="#/">APT Repository</a>
    <nav>
      <a href="#/" data-nav="repos">Repositories</a>
      <a href="#/upload" data-nav="upload">Upload</a>
      <a href="#/snapshots" data-nav="snapshots">Snapshots</a>
      <a href="#/setup" data-nav="setup">Client setup</a>
    </nav>
    <div class="topbar-right">
      <label class="check" title="Republish affected distributions after every change">
        <input type="checkbox" id="auto-publish"> Auto-publish
      </label>
      <span class="muted" id="version"></span>
      <button type="button" class="small" id="logout">Sign out</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
