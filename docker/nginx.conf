user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    access_log /dev/stdout;

    gzip on;
    gzip_types text/css application/javascript application/json;

    server {
        listen 80 default_server;
        server_name _;

        # Relative redirects keep working behind a TLS-terminating reverse proxy.
        absolute_redirect off;

        # Published repository (dists/, pool/) as written by `aptly publish`.
        root /data/aptly/public;

        # The signing key is public; keep it reachable even when the repo needs a login.
        location ~ ^/repo\.(gpg|asc)$ {
            try_files $uri =404;
        }

        location / {
            # Empty unless REPO_READ_USER is set (see entrypoint.sh).
            include /etc/nginx/snippets/repo-auth.conf;
            autoindex on;
            try_files $uri $uri/ =404;
        }

        location = /ui {
            return 301 /ui/;
        }

        # The UI's static files are public: the page shows its own login form and sends the
        # credentials to /api/ itself. Relying on the browser's basic-auth dialog fails behind
        # proxies that drop WWW-Authenticate and in embedded browsers that never show it.
        location /ui/ {
            alias /usr/share/apt-ui/;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        # Generated by the entrypoint; names the repository read user, so keep it private.
        location = /ui/info.json {
            auth_basic "APT repository admin";
            auth_basic_user_file /etc/nginx/htpasswd-admin;
            alias /usr/share/apt-ui/info.json;
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            auth_basic "APT repository admin";
            auth_basic_user_file /etc/nginx/htpasswd-admin;

            client_max_body_size 2g;
            proxy_request_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:8080;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
